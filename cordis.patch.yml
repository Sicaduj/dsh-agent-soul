# @local/dsh-agent-soul — Agent Teams "Soul" layer.
#
# Adds the Agent Soul layer on top of the shipped DSH 0.2.2 Agent Teams rows. The base
# `tool-agent-team` row stays enabled and keeps the Team task board/policy; this package adds
# soul-aware `spawn_teammate` (`agent_type`), `list_agent_souls`, the Lead prompt catalog,
# a soul-only delegation guard, and one user-invocable slash command per soul.
#
# Profiles upgraded from the pre-0.2.2 plugin may still carry a
# `- id: tool-agent-team` `disabled: true` override. The plugin warns about that at
# activation; remove it, or run `manage_agent_souls({ action: "repair_team_tools" })`
# to re-enable the base row through the Plugin Manager.
#
# This row carries no workspace-relative paths, so one installation is portable: every
# Session resolves user content against its own workspace root. The package itself ships
# the bundled soul catalog (`agents/`) and the bundled orchestrator doctrine
# (`defaults/orchestrator.md`). With `bundled: true` (the default) those apply in any
# workspace that has no local definition, so `/orchestrate` and the bundled souls work
# immediately after installation, from whichever workspace the person happens to use.
#
# Local overrides stay per workspace:
#   - souls: the configured `dirs` (default `<workspace>/.dsh/agents`), which take
#     precedence over the bundled catalog for duplicate names;
#   - orchestrator doctrine: `<dirname(bindingsFile)>/orchestrator.md`
#     (default `<workspace>/.dsh/agent-soul/orchestrator.md`);
#   - plugin-owned state: beside the bindings file, default
#     `<workspace>/.dsh/agent-soul/`.
# Set `bundled: false` for strictly workspace-scoped content (a missing local definition
# then makes `/orchestrate` refuse to enable).
#
# `bundledEditable: true` (with `bundled: true`) is the opt-in authoring mode: the packaged
# `agents/` souls and `defaults/orchestrator.md` then open editable in Settings > Agent Soul and
# save back into the package directory. Those edits are shared by every workspace in the profile
# and are lost if the package is reinstalled or updated; the flag is ignored when `bundled: false`.
# The GUI can also set `bundledEditable` for you (Plugins page toggle "Use Default Agent Souls", or
# the "Use default agent souls" switch in the Agent Soul settings card), which rewrites this row config.

- insert:
    - id: agent-soul-team
      name: '@local/dsh-agent-soul'
      config:
        freshProvider: spawn
        forkProvider: fork
